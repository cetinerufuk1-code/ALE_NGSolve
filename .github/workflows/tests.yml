name: Tests

on:
  push:
    paths:
      - 'src/**'
  pull_request:
    paths:
      - 'src/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
            enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev
        
      - name: Run tests
        run: uv run src/heat_conduction_lin.py